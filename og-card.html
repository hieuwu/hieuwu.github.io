<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social preview card</title>
<!--
  Source for public/assets/img/og-image.png, 1200x630.

  Re-render after editing:
    ~/.claude/skills/social-preview-image/scripts/render.sh \
      -o public/assets/img/og-image.png og-card.html

  Kept in the project root so the relative screenshot paths below resolve.
  Tokens mirror src/styles/theme-ocean.css.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --twilight:  #03045e;   /* deep twilight: card background */
        --cyan:      #caf0f8;   /* light cyan: headline           */
        --surf:      #00b4d8;   /* turquoise surf: accent         */
        --frost:     #90e0ef;   /* frosted blue: supporting copy  */
        --on-surf:   #00141a;   /* text on the accent fill         */

        --font-display: 'Figtree', system-ui, sans-serif;
        --font-body:    'Figtree', system-ui, sans-serif;
        --font-mono:    'JetBrains Mono', ui-monospace, monospace;

        --w: 1200px;
        --h: 630px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: var(--w); height: var(--h); overflow: hidden; }

    body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 36px;
        /* Right padding keeps the phones clear of the edge, platforms re-crop
           OG images to their own ratios, and anything touching a border risks
           being chopped. */
        padding: 58px 56px 58px 68px;
        background: var(--twilight);
        font-family: var(--font-body);
        color: var(--cyan);
        -webkit-font-smoothing: antialiased;
    }

    /* Flat shapes only: gradients band badly after the JPEG recompression
       most platforms apply to share images. */
    .shape {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
    }
    .shape-a {
        width: 620px; height: 620px;
        right: -180px; top: -260px;
        background: rgba(0, 180, 216, .13);
    }
    .shape-b {
        width: 460px; height: 460px;
        left: -190px; bottom: -220px;
        background: rgba(144, 224, 239, .10);
    }
    .ring {
        position: absolute;
        right: 120px; bottom: -190px;
        width: 420px; height: 420px;
        border: 2px solid rgba(0, 180, 216, .22);
        border-radius: 50%;
    }

    /* ---------- left: the message ---------- */
    .copy { width: 620px; flex-shrink: 0; position: relative; z-index: 1; }

    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .brand .tile {
        width: 46px; height: 46px;
        border-radius: 12px;
        background: var(--surf);
        color: var(--on-surf);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-mono);
        font-weight: 600; font-size: 17px;
        letter-spacing: -0.02em;
    }
    .brand .name {
        font-family: var(--font-display);
        font-weight: 800; font-size: 27px; letter-spacing: -0.03em;
    }

    h1 {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 72px;
        line-height: .88;
        letter-spacing: -0.045em;
        margin-bottom: 20px;
    }

    .specialty {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.025em;
        color: var(--surf);
        margin-bottom: 26px;
    }

    .lede {
        font-size: 21px; line-height: 1.42;
        color: var(--frost);
        max-width: 560px;
        margin-bottom: 32px;
    }

    .pills { display: flex; gap: 12px; flex-wrap: wrap; }
    .pill {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 20px;
        border-radius: 999px;
        background: var(--surf);
        color: var(--on-surf);
        font-weight: 700; font-size: 17px;
    }
    .pill svg { width: 21px; height: 21px; flex-shrink: 0; }
    .pill.outline {
        background: transparent;
        color: var(--cyan);
        border: 2px solid rgba(202, 240, 248, .32);
    }

    /* ---------- right: the phones ---------- */
    /* Held inside the frame: platforms re-crop OG images to their own ratios,
       so anything bled off an edge risks being chopped. */
    .art {
        position: relative;
        z-index: 1;
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .art img {
        max-height: 100%;
        width: auto;
        display: block;
        filter: drop-shadow(0 26px 40px rgba(0, 0, 0, .45));
    }
    .art .front { transform: rotate(-5deg); z-index: 2; }
    .art .back  { transform: rotate(7deg); margin-left: -46px; margin-top: 44px; max-height: 86%; }
</style>
</head>
<body>

<div class="shape shape-a"></div>
<div class="shape shape-b"></div>
<div class="ring"></div>

<div class="copy">
    <div class="brand">
        <div class="tile">HV</div>
        <div class="name">Hieu Vu</div>
    </div>

    <h1>Senior Software Engineer</h1>

    <div class="specialty">Mobile application development</div>

    <p class="lede">Reliable, offline-first mobile products. Architected, built and shipped to both stores.</p>

    <div class="pills">
        <div class="pill">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
            App Store
        </div>
        <div class="pill">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
            Google Play
        </div>
        <div class="pill outline">Ho Chi Minh City</div>
    </div>
</div>

<div class="art">
    <img class="front" src="public/assets/showcases/kudossnap/ios/kudos-feed.webp" alt="">
    <img class="back" src="public/assets/showcases/arkrates/ios/home-1.webp" alt="">
</div>

</body>
</html>
