<!doctype html>
<html lang="en" data-astryx-theme="neutral" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/img/favicon.ico" sizes="any" />

    <title>Hieu Vu | Senior Software Engineer · Android &amp; Kotlin Multiplatform</title>
    <meta
      name="description"
      content="Hieu Vu is a senior software engineer in Ho Chi Minh City specialising in Android and Kotlin Multiplatform, building reliable, offline-first mobile products and shipping them to the Play Store and App Store."
    />
    <meta name="author" content="Hieu Vu" />
    <link rel="canonical" href="https://hieuwu.github.io/" />
    <meta name="theme-color" content="#010113" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4fcfe" media="(prefers-color-scheme: light)" />

    <!-- Link previews.
         Crawlers don't resolve relative URLs, so every one of these is absolute.
         The card is PNG rather than WebP: X and Facebook handle WebP, LinkedIn
         and several Slack unfurls still don't. Source: og-card.html in the repo
         root, re-render it if the copy here changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hieu Vu" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://hieuwu.github.io/" />
    <meta
      property="og:title"
      content="Hieu Vu | Senior Software Engineer · Android &amp; Kotlin Multiplatform"
    />
    <meta
      property="og:description"
      content="Reliable, offline-first mobile products. Architected, built and shipped to the Play Store and App Store."
    />
    <meta property="og:image" content="https://hieuwu.github.io/assets/img/og-image.png" />
    <meta property="og:image:secure_url" content="https://hieuwu.github.io/assets/img/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hieu Vu, Senior Software Engineer, mobile application development. App Store and Google Play badges beside screenshots of the Kudos Snap and Ark Rates iOS apps."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hieuwu99" />
    <meta name="twitter:creator" content="@hieuwu99" />
    <meta
      name="twitter:title"
      content="Hieu Vu | Senior Software Engineer · Android &amp; Kotlin Multiplatform"
    />
    <meta
      name="twitter:description"
      content="Reliable, offline-first mobile products. Architected, built and shipped to the Play Store and App Store."
    />
    <meta name="twitter:image" content="https://hieuwu.github.io/assets/img/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Hieu Vu, Senior Software Engineer, mobile application development."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme =
            stored || (prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
