<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/img/favicon.ico" sizes="any" />

    <title>Hieu Vu | Senior Software Engineer · Android &amp; Kotlin Multiplatform</title>
    <meta
      name="description"
      content="Hieu Vu is a senior software engineer in Ho Chi Minh City specialising in Android and Kotlin Multiplatform, building reliable, offline-first mobile products and shipping them to the Play Store and App Store."
    />
    <meta name="author" content="Hieu Vu" />
    <link rel="canonical" href="https://hieuwu.github.io/" />
    <meta name="theme-color" content="#f8f9ff" />

    <!-- Link previews.
         Crawlers don't resolve relative URLs, so every one of these is absolute.
         The card is PNG rather than WebP: X and Facebook handle WebP, LinkedIn
         and several Slack unfurls still don't. Source: og-card.html in the repo
         root, re-render it if the copy here changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hieu Vu" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://hieuwu.github.io/" />
    <meta
      property="og:title"
      content="Hieu Vu | Senior Software Engineer · Android &amp; Kotlin Multiplatform"
    />
    <meta
      property="og:description"
      content="Reliable, offline-first mobile products. Architected, built and shipped to the Play Store and App Store."
    />
    <meta property="og:image" content="https://hieuwu.github.io/assets/img/og-image.png?v=3" />
    <meta property="og:image:secure_url" content="https://hieuwu.github.io/assets/img/og-image.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hieu Vu, Senior Software Engineer. Mobile development enthusiast, open source lover, building Android apps with robust and scalable architecture. Android, Apple and Kotlin logos."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hieuwu99" />
    <meta name="twitter:creator" content="@hieuwu99" />
    <meta
      name="twitter:title"
      content="Hieu Vu | Senior Software Engineer · Android &amp; Kotlin Multiplatform"
    />
    <meta
      name="twitter:description"
      content="Reliable, offline-first mobile products. Architected, built and shipped to the Play Store and App Store."
    />
    <meta name="twitter:image" content="https://hieuwu.github.io/assets/img/og-image.png?v=3" />
    <meta
      name="twitter:image:alt"
      content="Hieu Vu, Senior Software Engineer. Mobile development enthusiast, open source lover, building Android apps with robust and scalable architecture. Android, Apple and Kotlin logos."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,300..900,0..100&family=Google+Sans+Code:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Light is the default; dark only applies once the visitor picks it.
      (function () {
        try {
          // Not 'theme': the old site wrote that key on every visit. See useTheme.ts.
          var stored = localStorage.getItem('color-theme');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
